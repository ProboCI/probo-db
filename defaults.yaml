host: 0.0.0.0
port: 8442

buildsEventStream:
  plugin: Kafka
  config:
    groupId: 'proboDb'
    consumerTopic: 'build_events'
    brokers:
      - 'localhost:9092'
    clientId: 'probo-db'
    version: 1

pluginDirectory: null

knex: {
  test: {
    client: 'pg',
    connection: {
      database: 'probodb_test',
      user:     'probodb_test',
      password: 'password',
      host: 'localhost'
    },
    pool: {
      min: 2,
      max: 10
    },
    migrations: {
      tableName: 'knex_migrations'
    }
  },

  production: {
    client: 'pg',
    connection: {
      database: 'probodb',
      user:     'probodb',
      password: 'password',
      host: 'localhost'
    },
    pool: {
      min: 2,
      max: 10
    },
    migrations: {
      tableName: 'knex_migrations'
    }
  }
}

serverName: probodb

version: '1.0.0'
